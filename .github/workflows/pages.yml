# Builds the wasm port for each published GitHub release, attaches the built
# site to the release as a zip, and deploys that same build to GitHub Pages,
# so the live site is always the latest release.
# No game data is shipped: players load their own disc files in the page.
#
# To release: gh release create v0.2.0 --target main --generate-notes
name: Release and deploy to Pages

on:
  release:
    types: [published]
  # Manual redeploy: run against a release tag to rebuild that release.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1

      - name: Build wasm
        run: wasm-pack build crates/stackers-web --release --target web --out-dir "$PWD/site/pkg"

      # Keep the repo's layout (web/ beside pkg/) so play.html's ../pkg/ imports resolve.
      - name: Assemble site
        run: |
          rm -f site/pkg/.gitignore
          cp -r web site/web
          cat > site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=web/">
          <title>Stackers Resto</title>
          <a href="web/">Go to the game</a>
          EOF
          echo "${{ github.ref_name }}" > site/VERSION

      - name: Attach site to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          (cd site && zip -qr "../stackers-web-$TAG.zip" .)
          gh release upload "$TAG" "stackers-web-$TAG.zip" --clobber

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
