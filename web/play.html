<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stackers Resto</title>
<style>
  :root { --bg: #f6f5f2; --fg: #1d1d1f; --muted: #6b6b70; --line: #ddd9d2; --accent: #c2410c; --well: #23232a; --wall: #3a3a44; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151517; --fg: #ececee; --muted: #9a9aa2; --line: #2c2c31; --accent: #fb923c; --well: #0d0d10; --wall: #2c2c34; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0; }
  header a { color: var(--muted); }
  main { display: flex; gap: 24px; padding: 16px; flex-wrap: wrap; justify-content: center; }
  canvas { image-rendering: pixelated; width: min(100%, 960px, calc(82vh * 4 / 3)); aspect-ratio: 4 / 3; background: var(--well); border-radius: 4px; }
  aside { min-width: 200px; max-width: 280px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0 0 16px; font-variant-numeric: tabular-nums; }
  dt { color: var(--muted); }
  dd { margin: 0; text-align: right; }
  #msg { font-weight: 600; color: var(--accent); min-height: 1.4em; }
  .keys { color: var(--muted); font-size: 12px; }
  .keys kbd { border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font: 11px ui-monospace, monospace; }
  button, select { font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: none; color: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Stackers Resto · play</h1>
  <label title="Track 01 for art and sound; Tracks 02–12 add music">Disc .bin files (select all) <input type="file" id="disc" accept=".bin" multiple></label>
  <span id="art" class="keys">placeholder art</span>
  <span id="bgm" class="keys"></span>
  <label>Level <select id="level"></select></label>
  <button id="restart">Restart</button>
  <button id="pause">Freeze</button>
  <button id="mute">Mute</button>
  <a href="index.html">asset viewer</a>
</header>
<main>
  <canvas id="cv" width="320" height="240"></canvas>
  <aside>
    <div id="msg"></div>
    <dl id="stats"></dl>
    <p class="keys">
      <kbd>←</kbd><kbd>→</kbd> move · <kbd>↓</kbd> drop<br>
      <kbd>Z</kbd> rotate (✕) · <kbd>X</kbd> rotate (○)<br>
      <kbd>Enter</kbd> Start (pause menu) · <kbd>S</kbd> △ (back)<br>
      <kbd>P</kbd> freeze · <kbd>R</kbd> restart · <kbd>M</kbd> mute<br>
      Music needs the audio tracks: pick all the disc's .bin files at once.<br>
      Gamepad: d-pad, A/B (or ✕/○).
    </p>
  </aside>
</main>
<script type="module">
  import init, { Session, Sprites, Screen, Sfx, Music, GameDisc, decode_tim_semi } from "../pkg/stackers_web.js";
  await init();
  const $ = (id) => document.getElementById(id);

  // ---- real art: a few files from the user's disc, cached in IndexedDB ----
  // The executable holds the screen layout and the sound tables; Screen names the TIMs it needs.
  const ANM = "DERODERO/DATA/BLT_ANM.OBJ";
  const SD_CHR = "DERODERO/DATA/SD_CHR.OBJ"; // game-over messages
  const EXE = "SLUS_003.15";
  const SE_VH = "DERODERO/SOUND/VAB_SE/DEROMAIN.VH", SE_VB = "DERODERO/SOUND/VAB_SE/DEROMAIN.VB";
  const SOUND = [EXE, SE_VH, SE_VB];
  // "Record" panel: the best erase number, kept per browser (the original keeps it in RAM).
  let record = 0;
  try { record = Number(localStorage.getItem("stackers.record")) || 0; } catch {}
  let sprites = null, screen = null, pageData = new Map(), sheetCache = new Map(), bgCanvas = null, sdChr = null;
  let session, paused = false, keyBits = 0;
  let sfx = null, audio = null, sfxBuffers = new Map(), muted = false;
  // Music: CD-DA tracks played straight from the user's raw .bin files (see Music in wasm).
  let music = null, trackFiles = new Map(), bgmUrl = null, bgmTrack = 0, bgmWant = false;
  const bgm = new Audio();
  bgm.volume = 0.5;

  function idb() {
    return new Promise((ok, fail) => {
      const rq = indexedDB.open("stackers-resto", 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore("files");
      rq.onsuccess = () => ok(rq.result);
      rq.onerror = () => fail(rq.error);
    });
  }
  async function idbGet(keys) {
    const db = await idb();
    const st = db.transaction("files").objectStore("files");
    return Promise.all(keys.map((k) => new Promise((ok) => { const r = st.get(k); r.onsuccess = () => ok(r.result); r.onerror = () => ok(undefined); })));
  }
  async function idbPut(entries) {
    const db = await idb();
    const tx = db.transaction("files", "readwrite");
    for (const [k, v] of entries) tx.objectStore("files").put(v, k);
    return new Promise((ok, fail) => { tx.oncomplete = ok; tx.onerror = () => fail(tx.error); });
  }

  // Disc paths of the art the solo screen draws: animation bank, background, texture pages.
  function artPaths(exe) {
    const s = new Screen(exe);
    const pages = [...s.pages()].map((p) => [p, s.page_file(p)]);
    const bg = s.background();
    s.free();
    return { bg, pages, all: [ANM, SD_CHR, bg, ...pages.map(([, f]) => f)] };
  }

  // `get(path)` returns the bytes (from the disc, the cache or extracted/).
  async function useArt(exe, get) {
    const paths = artPaths(exe);
    const files = new Map(await Promise.all(paths.all.map(async (p) => [p, await get(p)])));
    if (![...files.values()].every(Boolean)) throw new Error("missing art files");
    sprites?.free(); screen?.free();
    sprites = new Sprites(files.get(ANM));
    screen = new Screen(exe);
    screen.record = record;
    sdChr = files.get(SD_CHR);
    if (session) try { session.set_sd_chr(sdChr); } catch (e) { console.warn("no game-over scripts", e); }
    pageData = new Map(paths.pages.map(([p, f]) => [p, files.get(f)]));
    sheetCache = new Map();
    bgCanvas = toCanvas(decode_tim_semi(files.get(paths.bg), 0, false), 128);
    $("art").textContent = "art from your disc";
    return files;
  }

  function useSound(exe, vh, vb) {
    try {
      sfx?.free();
      sfx = new Sfx(exe);
      sfx.add_bank(SE_VH, vh, vb);
      sfxBuffers = new Map();
    } catch (e) { console.warn("no sound", e); sfx = null; }
  }

  // Browsers only start audio after a user gesture.
  function unlockAudio() {
    if (!audio) audio = new AudioContext();
    if (audio.state === "suspended") audio.resume();
    if (bgmWant && bgm.src && bgm.paused) bgm.play().catch(() => {});
  }

  function useMusic(exe) {
    try { music?.free(); music = new Music(exe); } catch (e) { console.warn("no music table", e); music = null; }
  }

  const trackKey = (n) => `music/track${String(n).padStart(2, "0")}.bin`;
  // A track's raw .bin: picked this session, cached in IndexedDB, or (development) the rom/ folder.
  async function trackFile(n) {
    if (trackFiles.has(n)) return trackFiles.get(n);
    let blob = null;
    try { [blob] = await idbGet([trackKey(n)]); } catch {}
    if (!blob) {
      try {
        const nn = String(n).padStart(2, "0");
        const r = await fetch(`../rom/Tecmo Stackers (USA)/Tecmo Stackers (USA) (Track ${nn}).bin`);
        if (r.ok) blob = await r.blob();
      } catch {}
    }
    trackFiles.set(n, blob ?? null);
    return blob ?? null;
  }

  // Raw CD-DA is 16-bit little-endian stereo at 44.1 kHz, so a 44-byte WAV header makes it playable.
  function wav(pcm) {
    const h = new DataView(new ArrayBuffer(44)), str = (o, t) => [...t].forEach((c, i) => h.setUint8(o + i, c.charCodeAt(0)));
    str(0, "RIFF"); h.setUint32(4, 36 + pcm.size, true); str(8, "WAVEfmt ");
    h.setUint32(16, 16, true); h.setUint16(20, 1, true); h.setUint16(22, 2, true);
    h.setUint32(24, 44100, true); h.setUint32(28, 44100 * 4, true); h.setUint16(32, 4, true); h.setUint16(34, 16, true);
    str(36, "data"); h.setUint32(40, pcm.size, true);
    return new Blob([h.buffer, pcm], { type: "audio/wav" });
  }

  // Start the level's track from the top (what func_8003A050 does when a game starts).
  async function playMusic(level) {
    bgmWant = true;
    const e = level === "solo" ? music?.entry(8) : music?.for_level(Number(level));
    if (!e?.length) { $("bgm").textContent = ""; return; }
    const [n, start, end, loops] = e;
    if (n !== bgmTrack) {
      const file = await trackFile(n);
      if (!bgmWant) return;
      if (!file || file.size < end) { $("bgm").textContent = `music: add Track ${String(n).padStart(2, "0")}.bin`; return; }
      if (bgmUrl) URL.revokeObjectURL(bgmUrl);
      bgmUrl = URL.createObjectURL(wav(file.slice(start, end)));
      bgm.src = bgmUrl;
      bgmTrack = n;
    }
    bgm.loop = !!loops;
    bgm.currentTime = 0;
    bgm.muted = muted;
    $("bgm").textContent = `music: Track ${String(n).padStart(2, "0")}`;
    bgm.play().catch(() => { /* waits for the first key or click */ });
  }

  function stopMusic() { bgmWant = false; bgm.pause(); }

  function playSfx(id) {
    if (!sfx || !audio || muted || audio.state !== "running") return;
    let entry = sfxBuffers.get(id);
    if (entry === undefined) {
      const smp = sfx.sample(id);
      entry = null;
      if (smp) {
        const pcm = smp.pcm();
        const buf = audio.createBuffer(1, pcm.length, smp.rate);
        buf.copyToChannel(pcm, 0);
        entry = { buf, gain: smp.gain };
        smp.free();
      }
      sfxBuffers.set(id, entry);
    }
    if (!entry) return;
    const src = audio.createBufferSource(), g = audio.createGain();
    src.buffer = entry.buf;
    g.gain.value = entry.gain * 0.6;
    src.connect(g).connect(audio.destination);
    src.start();
  }

  // A decoded TIM as a canvas; `bright` is the PS1 texture modulation (128 = unchanged).
  function toCanvas(img, bright) {
    const px = new Uint8ClampedArray(img.rgba());
    if (bright !== 128) for (let i = 0; i < px.length; i += 4) {
      px[i] = px[i] * bright / 128; px[i + 1] = px[i + 1] * bright / 128; px[i + 2] = px[i + 2] * bright / 128;
    }
    const c = document.createElement("canvas");
    c.width = img.width; c.height = img.height;
    c.getContext("2d").putImageData(new ImageData(px, img.width, img.height), 0, 0);
    c.u0 = img.u0; c.v0 = img.v0; // sprite u/v are relative to the texture page, not the image
    img.free();
    return c;
  }

  // A texture page with one palette row, semi-transparency and brightness, as a canvas.
  function sheet(page, clut, mode) {
    const key = `${page}/${clut}/${mode}`;
    let c = sheetCache.get(key);
    if (!c) {
      c = toCanvas(decode_tim_semi(pageData.get(page), clut, (mode & 0x100) !== 0), mode & 0xff);
      sheetCache.set(key, c);
    }
    return c;
  }

  // Screen draw list (`Screen.solo`): [page, clut, u, v, w, h, x, y, draw_w, draw_h, flip, mode].
  function drawScreen(g, list) {
    for (let i = 0; i < list.length; i += 12) {
      const [page, clut, u, v, w, h, x, y, dw, dh, flip, mode] = list.subarray(i, i + 12);
      const src = sheet(page, clut, mode), su = u - src.u0, sv = v - src.v0;
      if (flip) {
        g.save(); g.translate(x + dw, y); g.scale(-1, 1);
        g.drawImage(src, su, sv, w, h, 0, 0, dw, dh);
        g.restore();
      } else g.drawImage(src, su, sv, w, h, x, y, dw, dh);
    }
  }

  $("disc").addEventListener("change", async (ev) => {
    const files = [...ev.target.files];
    if (!files.length) return;
    // Audio tracks are recognised by the "(Track NN)" in their names; the data track is
    // Track 01, or the only file picked.
    const trackNo = (f) => Number(/track\s*0*(\d+)/i.exec(f.name)?.[1] ?? 0);
    const audioFiles = files.filter((f) => trackNo(f) >= 2);
    if (audioFiles.length) {
      for (const f of audioFiles) trackFiles.set(trackNo(f), f);
      try { await idbPut(audioFiles.map((f) => [trackKey(trackNo(f)), f])); } catch (e) { console.warn("music not cached", e); }
      bgmTrack = 0;
      if (bgmWant) playMusic($("level").value);
    }
    const file = files.find((f) => trackNo(f) === 1) ?? (files.length === 1 && !audioFiles.length ? files[0] : null);
    if (!file) { ev.target.blur(); return; }
    $("art").textContent = `reading ${file.name}…`;
    try {
      const disc = new GameDisc(new Uint8Array(await file.arrayBuffer()));
      const sound = SOUND.map((p) => disc.read(p));
      const art = await useArt(sound[0], async (p) => disc.read(p));
      disc.free();
      await idbPut([...art, ...SOUND.map((p, i) => [p, sound[i]])]);
      useSound(...sound);
      useMusic(sound[0]);
      bgmTrack = 0;
      playMusic($("level").value);
    } catch (e) {
      $("art").textContent = `could not use that disc: ${e.message ?? e}`;
    }
    ev.target.blur();
  });

  try {
    const sound = await idbGet(SOUND);
    if (sound.every(Boolean)) {
      useSound(...sound); useMusic(sound[0]);
      await useArt(sound[0], async (p) => (await idbGet([p]))[0]);
    }
  } catch (e) { console.warn("asset cache incomplete", e); }
  // Development: files extracted by tools/extract_disc.py, served from the repo root.
  const getExtracted = async (p) => { const r = await fetch(`../extracted/disc/${p}`); if (!r.ok) throw r.status; return new Uint8Array(await r.arrayBuffer()); };
  if (!sprites) {
    try {
      await useArt(await getExtracted(EXE), getExtracted);
      $("art").textContent = "art from extracted/";
    } catch { /* no local extraction: placeholder art until a disc is loaded */ }
  }
  if (!sfx) {
    try {
      const sound = await Promise.all(SOUND.map(getExtracted));
      useSound(...sound);
      useMusic(sound[0]);
    } catch { /* silent until a disc is loaded */ }
  }

  // PS1 pad bits (stackers_core::pad).
  const PAD = { TRIANGLE: 0x10, CROSS: 0x40, CIRCLE: 0x20, START: 0x800, UP: 0x1000, RIGHT: 0x2000, DOWN: 0x4000, LEFT: 0x8000 };
  const KEYS = { ArrowLeft: PAD.LEFT, ArrowRight: PAD.RIGHT, ArrowDown: PAD.DOWN, ArrowUp: PAD.UP,
                 KeyZ: PAD.CROSS, KeyX: PAD.CIRCLE, KeyS: PAD.TRIANGLE, Enter: PAD.START };
  const ST = { EMPTY: 0, FALLING: 1, SETTLED: 2, CLEAR: 4, CLEAR_ARMS: 5, REACH: 8, HOLD: 9, RETRACT: 10 };
  const ANIM = { 4: 47, 5: 47, 8: 12, 9: 30, 10: 13 };
  const COLOURS = [null, "#e5484d", "#30a46c", "#3e63dd", "#f5d90a", "#8e4ec6", "#9ba1a6"];
  const T = 16, STRIDE = 7;

  const cv = $("cv"), ctx = cv.getContext("2d");
  // Placeholder layout = the real one (stackers_formats::hud): field at (+8, −64), queue window.
  const FIELD_ORIGIN = [8, -64], QUEUE_X = 147, QUEUE_TOP = 44;

  // "Solo" = mode 4 (row 3 + its own speed-up, music 8); numbers = mode-13 level rows.
  $("level").add(new Option("Solo", "solo"));
  for (let i = 0; i < 14; i++) $("level").add(new Option(String(i + 1), String(i)));
  // The session raises its record at game over (erase number ≥ record → "You win").
  function gameOver() {
    stopMusic();
    if (session.record === record) return;
    record = session.record;
    if (screen) screen.record = record;
    try { localStorage.setItem("stackers.record", String(record)); } catch {}
  }

  function start() {
    session?.free();
    const seed = (Math.random() * 0xffffffff) >>> 0, lv = $("level").value;
    session = lv === "solo" ? Session.solo(seed) : new Session(seed, Number(lv));
    session.record = record;
    if (sdChr) try { session.set_sd_chr(sdChr); } catch (e) { console.warn("no game-over scripts", e); }
    sprites?.reset();
    paused = false;
    playMusic($("level").value);
    $("pause").textContent = "Freeze";
  }

  addEventListener("pointerdown", unlockAudio);
  addEventListener("keydown", (e) => {
    unlockAudio();
    if (KEYS[e.code] !== undefined) { keyBits |= KEYS[e.code]; e.preventDefault(); }
    if (e.code === "KeyM") toggleMute();
    if (e.code === "KeyP") togglePause();
    if (e.code === "KeyR") start();
  });
  addEventListener("keyup", (e) => { if (KEYS[e.code] !== undefined) keyBits &= ~KEYS[e.code]; });
  addEventListener("blur", () => { keyBits = 0; });
  $("restart").onclick = () => { start(); $("restart").blur(); };
  $("pause").onclick = () => { togglePause(); $("pause").blur(); };
  $("level").onchange = () => { start(); $("level").blur(); };
  function toggleMute() { muted = !muted; bgm.muted = muted; $("mute").textContent = muted ? "Unmute" : "Mute"; }
  $("mute").onclick = () => { toggleMute(); $("mute").blur(); };
  function togglePause() {
    if (session.stats()[8]) return;
    paused = !paused;
    $("pause").textContent = paused ? "Resume" : "Freeze";
    if (paused) bgm.pause(); else if (bgmWant && bgm.src) bgm.play().catch(() => {});
  }

  function padBits() {
    let b = 0;
    for (const gp of navigator.getGamepads?.() ?? []) {
      if (!gp) continue;
      const on = (i) => gp.buttons[i]?.pressed;
      if (on(0)) b |= PAD.CROSS;
      if (on(1)) b |= PAD.CIRCLE;
      if (on(3)) b |= PAD.TRIANGLE;
      if (on(9)) b |= PAD.START;
      if (on(12) || gp.axes[1] < -0.5) b |= PAD.UP;
      if (on(13) || gp.axes[1] > 0.5) b |= PAD.DOWN;
      if (on(14) || gp.axes[0] < -0.5) b |= PAD.LEFT;
      if (on(15) || gp.axes[0] > 0.5) b |= PAD.RIGHT;
    }
    return b;
  }

  // ---- drawing (all in field pixels; cell (c, r) is at 16c, 16r) ----
  function blob(g, x, y, colour, scale = 1, alpha = 1) {
    if (!COLOURS[colour]) return;
    g.globalAlpha = alpha;
    g.fillStyle = COLOURS[colour];
    g.beginPath();
    g.arc(x + 8, y + 8, 7 * scale, 0, Math.PI * 2);
    g.fill();
    if (scale > 0.6) { // eyes
      g.fillStyle = "#fff";
      g.fillRect(x + 4, y + 5, 3, 3); g.fillRect(x + 9, y + 5, 3, 3);
      g.fillStyle = "#000";
      g.fillRect(x + 5, y + 6, 1, 1); g.fillRect(x + 10, y + 6, 1, 1);
    }
    g.globalAlpha = 1;
  }

  // An arm runs from the blob across empty cells to the first occupied cell in that row.
  function arm(grid, c, r, x, y, dir, colour, reach) {
    let len = 0;
    for (let k = c + dir; k >= 1 && k <= 6 && !grid[r][k]; k += dir) len++;
    const px = len * T * reach;
    ctx.fillStyle = COLOURS[colour];
    const y0 = y + 7;
    if (dir > 0) ctx.fillRect(x + 14, y0, px + 2, 3);
    else ctx.fillRect(x + 2 - px - 2, y0, px + 2, 3);
  }

  function draw() {
    if (sprites && screen) {
      ctx.drawImage(bgCanvas, 0, 0);
      drawScreen(ctx, screen.solo(sprites, session));
      stats();
      return;
    }
    const cells = session.cells();
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.save();
    ctx.translate(...FIELD_ORIGIN);
    // walls: columns 0 and 7, floor row 18
    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue("--wall");
    ctx.fillRect(0, 0, T, 19 * T); ctx.fillRect(7 * T, 0, T, 19 * T); ctx.fillRect(0, 18 * T, 8 * T, T);
    // death cell marker
    const dr = session.death_row;
    ctx.strokeStyle = "rgba(255,80,80,.45)"; ctx.setLineDash([2, 2]);
    ctx.strokeRect(3 * T + 0.5, dr * T + 0.5, T - 1, T - 1); ctx.setLineDash([]);

    const grid = Array.from({ length: 18 }, () => new Array(8).fill(0));
    for (let i = 0; i < cells.length; i += STRIDE)
      if (cells[i + 2] === ST.SETTLED || cells[i + 2] >= ST.REACH || cells[i + 2] === ST.CLEAR || cells[i + 2] === ST.CLEAR_ARMS)
        grid[cells[i + 1]][cells[i]] = 1;

    for (let i = 0; i < cells.length; i += STRIDE) {
      const [c, r, state, colour, fx, fy, packed] = cells.subarray(i, i + STRIDE);
      if (state === ST.EMPTY) continue;
      const [x, y] = state === ST.FALLING ? [fx, fy] : [c * T, r * T];
      const arms = packed & 0xff, age = packed >> 8;
      const t = ANIM[state] ? Math.min(1, age / ANIM[state]) : 0;
      if (state === ST.CLEAR || state === ST.CLEAR_ARMS) {
        const flash = Math.floor(age / 4) % 2 === 0;
        blob(ctx, x, y, colour, 1 - 0.8 * t, flash ? 1 : 0.5);
        continue;
      }
      if (arms && state >= ST.REACH) {
        const reach = state === ST.REACH ? t : state === ST.HOLD ? 1 : 1 - t;
        if (arms & 1) arm(grid, c, r, x, y, -1, colour, reach);
        if (arms & 2) arm(grid, c, r, x, y, 1, colour, reach);
      }
      blob(ctx, x, y, colour);
    }

    const p = session.piece();
    if (p[0]) { blob(ctx, p[1], p[2], p[3]); blob(ctx, p[4], p[5], p[6]); }

    ctx.restore();

    // queue window: satellite above pivot, scaled by max(128 − y, 91)/128 like the original
    const q = session.queue(), qy = session.queue_y();
    ctx.strokeStyle = "rgba(128,128,128,.6)";
    ctx.strokeRect(140.5, 20.5, 31, 116);
    for (let i = 0; i < 2; i++) {
      const y = qy[i] + QUEUE_TOP, k = Math.max(128 - qy[i], 91) / 128, cell = Math.floor(k * 16);
      const x = QUEUE_X + ((16 - cell) >> 1) + cell / 2 - 8;
      blob(ctx, x, y + cell / 2 - 8, q[2 * i + 1], k); blob(ctx, x, y + cell + cell / 2 - 8, q[2 * i], k);
    }
    stats();
  }

  function stats() {
    const s = session.stats(), [score, erased, time] = session.hud();
    const clock = `${time >>> 24}:${String((time >> 16) & 0x3f).padStart(2, "0")}'${String((time >> 8) & 0x3f).padStart(2, "0")}`;
    const rows = [["Score", score], ["Erased", erased], ["Record", record], ["Time", clock], ["Level", s[0] + 1], ["Colours", s[1]], ["Speed", s[9]], ["Cleared", s[2]], ["Chain", s[3]],
                  ["Best chain", s[4]], ["Attack", s[5]], ["Pieces", s[6]], ["Frame", session.frame()]];
    $("stats").innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
    $("msg").textContent = s[8] ? "Game over · Enter (Start) continues, Z (✕) counts down" : paused ? "Frozen" : session.paused ? "Pause menu · ↑↓ choose, Z (✕) select, Enter (Start) resumes" : s[3] >= 2 ? `${s[3]} chain!` : "";
  }

  // ---- fixed 60 Hz step ----
  const DT = 1000 / 60;
  let acc = 0, last = performance.now();
  function frame(now) {
    acc += Math.min(now - last, 250);
    last = now;
    while (acc >= DT) {
      if (!paused) {
        const wasOver = session.stats()[8];
        session.step(keyBits | padBits());
        for (const id of session.sounds()) playSfx(id);
        if (!wasOver && session.stats()[8]) gameOver();
        // Start during the countdown (or Retry in the pause menu) retries; when the countdown
        // runs out (or Quit) the original returns to the title, which isn't ported yet, so
        // both start a new game.
        if (session.outcome) start();
      }
      acc -= DT;
    }
    draw();
    requestAnimationFrame(frame);
  }
  start();
  requestAnimationFrame(frame);
</script>
</body>
</html>
